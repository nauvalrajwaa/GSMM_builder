<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Escher – Gene Mutation Maps</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f6f9; }
    header { background: #2c5282; color: #fff; padding: 1rem 1.5rem; }
    header h1 { font-size: 1.3rem; margin: 0; }
    .sidebar { width: 300px; float: left; height: calc(100vh - 60px);
                overflow-y: auto; background: #fff;
                border-right: 1px solid #e2e8f0; padding: .5rem; }
    .main { margin-left: 300px; }
    .mtab { display: block; width: 100%; text-align: left; padding: .55rem .75rem;
              border: none; background: none; cursor: pointer; font-size: .82rem;
              border-bottom: 1px solid #f0f0f0; border-radius: 4px; margin-bottom: 2px; }
    .mtab:hover { background: #f7fafc; }
    .mtab.active { background: #ebf4ff; font-weight: 600; }
  </style>
</head>
<body>
<header><h1>Escher Gene Mutation Maps  (4 mutations)</h1></header>
<div class="sidebar">
<button class="mtab active" style="border-left:4px solid #C44E52;" onclick="switchMut(this,'mf-0')">Knockout: G_b2215 (b2215)  |  growth=141.4779  [Highly-connected outer-membrane porin gene (292 reactions)]</button>
<button class="mtab " style="border-left:4px solid #C44E52;" onclick="switchMut(this,'mf-1')">Knockout: G_b3552 (b3552)  |  growth=141.4779  [Transport/membrane gene (65 reactions)]</button>
<button class="mtab " style="border-left:4px solid #4C72B0;" onclick="switchMut(this,'mf-2')">Knockin: G_b3011 (b3011)  |  growth=141.4779  [Normally-silent gene – force activation of all its reactions]</button>
<button class="mtab " style="border-left:4px solid #4C72B0;" onclick="switchMut(this,'mf-3')">Knockin: G_b4034 (b4034)  |  growth=141.4779  [Open glucose uptake as a knockin rescue experiment]</button>

</div>
<div class="main">
<iframe id="mf-0" src="knockout_b2215.html" style="display:block;width:100%;height:85vh;border:none;"></iframe>
<iframe id="mf-1" src="knockout_b3552.html" style="display:none;width:100%;height:85vh;border:none;"></iframe>
<iframe id="mf-2" src="knockin_b3011.html" style="display:none;width:100%;height:85vh;border:none;"></iframe>
<iframe id="mf-3" src="knockin_b4034.html" style="display:none;width:100%;height:85vh;border:none;"></iframe>

</div>
<script>
function switchMut(btn, id) {
  document.querySelectorAll('.mtab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
  btn.classList.add('active');
  document.getElementById(id).style.display = 'block';
}
</script>
</body>
</html>
